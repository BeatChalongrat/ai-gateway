<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  doc-converter: Thai fonts named by Office documents that the image does
  not have. TLWG's own rules already map TH Sarabun New / TH SarabunPSK to
  Laksaman (the same metrics), Angsana New to Kinnari and Cordia New to
  Umpush. Tahoma and Leelawadee (the Thai fonts of Office themes and of
  Excel's default Thai text) would otherwise land on DejaVu Sans, which has
  no Thai: map them to Waree (Vera Latin, like DejaVu, plus Thai), then Loma.
  Sarabun (the repo's font, used by every Agent Market deliverable) is
  installed as itself and needs no rule.
-->
<fontconfig>
  <alias binding="same">
    <family>Tahoma</family>
    <prefer><family>Waree</family><family>Loma</family></prefer>
  </alias>
  <alias binding="same">
    <family>Leelawadee</family>
    <prefer><family>Waree</family><family>Loma</family></prefer>
  </alias>
  <alias binding="same">
    <family>Leelawadee UI</family>
    <prefer><family>Waree</family><family>Loma</family></prefer>
  </alias>
  <alias binding="same">
    <family>Microsoft Sans Serif</family>
    <prefer><family>Waree</family><family>Loma</family></prefer>
  </alias>
</fontconfig>
