[alembic]
script_location = migrations
# Fallback URL for local development.  At runtime, migrations/env.py overrides
# this with settings.database_url so the application config is the single
# source of truth.  This value is only used if env.py fails to load settings.
sqlalchemy.url = postgresql+psycopg://postgres:postgres@localhost:5432/ai_gateway

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
