<!doctype html>
<html>
  <body style="font-family: -apple-system, Segoe UI, Roboto, sans-serif; color: #111; max-width: 560px; margin: 0 auto; padding: 24px;">
    <h2 style="margin-top: 0;">You're invited to join {{tenant_name}}</h2>
    <p>{{inviter_name}} invited you to join the <strong>{{tenant_name}}</strong> team on SRAN AI Gateway.</p>
    <p>
      <a href="{{invite_link}}" style="display: inline-block; background: #6d28d9; color: #fff; padding: 12px 20px; border-radius: 8px; text-decoration: none; font-weight: 600;">Accept invite</a>
    </p>
    <p style="color: #6b7280; font-size: 13px;">Or paste this code into the signup form:</p>
    <p><code style="background: #f3f4f6; padding: 8px 12px; border-radius: 6px; font-size: 14px;">{{invite_code}}</code></p>
    <p style="color: #6b7280; font-size: 13px;">The invite expires in 7 days.</p>
    <p style="color: #6b7280; font-size: 13px;">— The SRAN team</p>
  </body>
</html>
