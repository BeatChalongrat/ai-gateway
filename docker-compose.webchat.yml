# Web Chat dev stack — runs alongside the existing gateway-api
# compose without colliding on ports or volumes.
#
# Port plan:
#   chat-edge-api  → host 4000 → container 4000
#   postgres       → host 5433 → container 5432   (gateway pg owns 5432)
#   redis          → host 6380 → container 6379   (gateway redis owns 6379)
#
# The existing ``docker-compose.yml`` provides ``gateway-api`` on
# host port 8080 (in-network DNS: ``backend:8080``). When the two
# stacks need to talk, run them on the same network OR set
# ``GATEWAY_API_URL=http://host.docker.internal:8080/api/v1`` for
# cross-stack calls during dev. Production uses a shared network.
#
# ── DO NOT MERGE THIS FILE WITH docker-compose.yml ──────────────────
# This is a SELF-CONTAINED SHAPE, not an overlay. The base file defines
# its own chat-edge-api behind ``profiles: ["desktop"]``; merging the two
# collapses both definitions into one profile-gated service, compose
# drops it (no active profile), and validation fails with
#   service "web-chat" depends on undefined service "chat-edge-api"
# Run this stack via ``make webchat-up`` (or
# ``docker compose -p ai-gateway -f docker-compose.webchat.yml …``).
# ``make compose-check`` validates every supported combination; the full
# list lives in README.md → "Deployment shapes".

services:
  chat-edge-api:
    build:
      context: ./services/chat-edge-api
      dockerfile: Dockerfile
    container_name: ai-gateway-chat-edge-api
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=postgres://chatedge:chatedge_pass@postgres-webchat:5432/sran_ai?sslmode=disable
      - REDIS_URL=redis://redis-webchat:6379/1
      # Existing gateway-api runs on host port 8080; route via
      # host.docker.internal so chat-edge can reach it across the
      # two compose stacks. ``extra_hosts`` below makes the alias
      # work on Linux too.
      - GATEWAY_API_URL=http://host.docker.internal:8080/v1
      - GATEWAY_API_KEY=${GATEWAY_API_KEY:-}
      # Proves X-User-ID to the gateway so rate limits AND credit
      # billing apply to the actual end user. MUST match the backend's
      # INTERNAL_SERVICE_SECRET. Empty -> header not sent (shared-key
      # semantics).
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:-}
      # FIX16 — cloud scheduled tasks (the always-on unattended firing loop).
      # OFF by default; flip CLOUD_SCHEDULER_ENABLED=true to turn it on. The
      # authorize URL is the BACKEND's /internal/scheduled-run/authorize
      # (revocation + balance gate); host.docker.internal:8081 is the backend's
      # host port from this stack. The 1-hour per-task floor is enforced in the
      # store; CLOUD_SCHEDULER_INTERVAL only bounds how often it scans.
      - CLOUD_SCHEDULER_ENABLED=${CLOUD_SCHEDULER_ENABLED:-false}
      - CLOUD_TASK_AUTHORIZE_URL=${CLOUD_TASK_AUTHORIZE_URL:-http://host.docker.internal:8081}
      - CLOUD_SCHEDULER_INTERVAL=${CLOUD_SCHEDULER_INTERVAL:-60s}
      # Bug 3: read the ONE .env value (same var + dev default as the backend
      # and base chat-edge) so signer and verifier never diverge. Hardcoding
      # the literal here re-introduced FIX 1's dormancy the moment
      # SERVICE_JWT_SECRET is set/rotated in .env (backend takes the new value,
      # this stayed pinned -> mismatch -> silent fallback).
      - SERVICE_JWT_SECRET=${SERVICE_JWT_SECRET:-dev-service-jwt-secret-change-in-prod}
      - USER_JWT_SECRET=${USER_JWT_SECRET:-dev-user-jwt-secret-change-in-prod}
      - CSRF_SECRET=${CSRF_SECRET:-dev-csrf-secret-change-in-prod}
      # Portal-JWT secret — MUST match the FastAPI backend's
      # ``portal_jwt_secret``. Tokens minted by the Portal verify here.
      - PORTAL_JWT_SECRET=${PORTAL_JWT_SECRET:-dev-stable-portal-key-change-in-prod}
      - PORT=4000
      - CHAT_EDGE_DEV=1
      - CHAT_EDGE_ADMIN_API_KEY=${CHAT_EDGE_ADMIN_API_KEY:-dev-chat-edge-admin-key-change-in-prod}
      - CORS_ALLOW_ORIGINS=http://localhost:3002
      - MAX_CONTEXT_MESSAGES=1000
      # Blob storage — default ``local`` writes under ./data/uploads
      # inside the container. Set STORAGE_BACKEND=s3 to route uploads
      # through the bundled MinIO service below (env vars wire in
      # automatically from .env or shell exports).
      - STORAGE_BACKEND=${STORAGE_BACKEND:-local}
      - S3_BUCKET=${S3_BUCKET:-sran-chat-files}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE:-true}
      # Phase B — image-generation tool. The gateway image model the
      # generate_image tool calls (gpt-image-1 is OpenAI's current image model).
      - IMAGE_GEN_MODEL=${IMAGE_GEN_MODEL:-gpt-image-1}
      - CHAT_EDGE_IMAGE_TIMEOUT_SECONDS=${CHAT_EDGE_IMAGE_TIMEOUT_SECONDS:-180}
      # ── Code-interpreter sandbox — ON BY DEFAULT on this stack ──────────
      # Every python path chat-edge shells out to (text extraction from
      # PDF/DOCX/XLSX, the Excel/Doc/Pptx plan executors, the inspectors and
      # validators, version compare, vision image resize, run_python) is
      # fail-closed: with no sandbox the services return Err*SandboxUnavailable
      # rather than running model-influenced python inside this
      # secret-bearing process. Leaving SANDBOX_ENABLED off therefore does
      # not "degrade gracefully" — it turns document reading and every
      # Office plan card into an error. So the stack ships it ON.
      #
      # Values below are IDENTICAL to docker-compose.sandbox.yml (which stays
      # for the base/desktop stack + `make sandbox-up`); this file just makes
      # them the default for the webchat stack instead of an opt-in overlay.
      #
      # Opt out with SANDBOX_ENABLED=0 in the environment — but read the
      # paragraph above first; the document features go with it.
      #
      # PREREQUISITE: the per-run image must exist on the daemon, else
      # chat-edge refuses to start (fail-loud, cmd/server/main.go). Use
      # `make webchat-up`, which builds it before bringing the stack up:
      #   docker build -f services/chat-edge-api/sandbox/Dockerfile.sandbox \
      #     -t ai-gateway-sandbox:latest services/chat-edge-api
      - SANDBOX_ENABLED=${SANDBOX_ENABLED:-1}
      - SANDBOX_IMAGE=${SANDBOX_IMAGE:-ai-gateway-sandbox:latest}
      # Path INSIDE the chat-edge container where the docker CLI reads the
      # seccomp profile (the CLI reads it and ships JSON to the daemon).
      - SANDBOX_SECCOMP_PATH=/sandbox/seccomp.json
      # ── HOST-vs-CONTAINER PATH — READ THIS (subtle, easy to invert) ──────
      # chat-edge is ITSELF a container, but the per-run sandbox is launched
      # by the HOST docker daemon. So there are TWO distinct paths:
      #   SANDBOX_WORKDIR      = the IN-CONTAINER staging root (the bind mount
      #                          target below) where chat-edge writes per-run
      #                          in/out dirs.
      #   SANDBOX_HOST_WORKDIR = the SAME dir AS THE DAEMON SEES IT — the HOST
      #                          side of that bind, used to build the
      #                          `docker run -v <host>:/job/out` source.
      # Setting HOST_WORKDIR to the in-container path makes the daemon -v a
      # path that exists only inside chat-edge → root-owned empty dir on the
      # host → uid-65534 can't write __meta.json → every run 503s.
      - SANDBOX_WORKDIR=/sandbox-runs
      - SANDBOX_HOST_WORKDIR=${SANDBOX_HOST_DIR:-${PWD}/data/sandbox-runs}
      # FIX17 §4 — DEVELOPMENT MODE of the sandbox (deliberate, not an
      # exception): SANDBOX_RUNTIME is unset, so per-run containers use the
      # daemon's default runtime (runc) with the STANDARD container boundary
      # — still no network, non-root (65534), all capabilities dropped,
      # seccomp, read-only rootfs, resource caps. What it is NOT is a
      # user-space kernel: a kernel bug is a host escape. Production sets
      # SANDBOX_RUNTIME=runsc (docker-compose.prod.yml) and chat-edge refuses
      # to boot if gVisor is not actually in effect. The boot log says which
      # mode you are in: `requested_runtime=runc boundary_in_effect=standard`
      # (dev) vs `requested_runtime=runsc boundary_in_effect=gvisor` (prod).
      # See docs/DEPLOY_SANDBOX.md.
      - SANDBOX_RUNTIME=${SANDBOX_RUNTIME:-}
    # Persist uploaded + AI-generated files across container restarts.
    # FILE_STORAGE_ROOT defaults to ./data/uploads → /app/data/uploads
    # (WORKDIR /app); generated images land under conversation-files/.
    volumes:
      - chat_edge_uploads:/app/data/uploads
      # ─────────────────────────────────────────────────────────────────────
      # DOCKER-SOCKET PRIVILEGE — READ THIS.
      # Mounting /var/run/docker.sock gives chat-edge the ability to control
      # the Docker daemon = effectively host root. That is a real privilege
      # increase. It is acceptable ONLY because the docker `run` argv is built
      # entirely by trusted Go (internal/sandbox) from server constants — NO
      # model input ever reaches it; the model only supplies a plan/code FILE
      # that runs INSIDE the no-privilege sandbox (--network none, seccomp
      # default-deny, --cap-drop ALL, uid 65534, read-only rootfs).
      # For a hardened prod posture, replace this socket mount with a minimal
      # BROKER service that owns the socket and exposes only execute(job);
      # then a chat-edge RCE still cannot issue arbitrary docker commands.
      # This is the pragmatic single-host form.
      # ─────────────────────────────────────────────────────────────────────
      - /var/run/docker.sock:/var/run/docker.sock
      # Shared staging dir. MUST be a bind to a real, ABSOLUTE host path so
      # the per-run in/out dirs chat-edge writes are the SAME inodes the
      # daemon bind-mounts into the sandbox container. A named volume would
      # NOT work (the daemon can't -v a path that exists only inside another
      # container's volume); a RELATIVE path would not resolve for
      # `docker run -v`. ${PWD} makes the default absolute.
      - ${SANDBOX_HOST_DIR:-${PWD}/data/sandbox-runs}:/sandbox-runs
      # Seccomp profile available to the CLI inside chat-edge.
      - ./services/chat-edge-api/sandbox/seccomp.json:/sandbox/seccomp.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres-webchat:
        condition: service_healthy
      redis-webchat:
        condition: service_healthy

  postgres-webchat:
    # pgvector/pgvector:pg16 ships Postgres 16 with the pgvector
    # extension preinstalled — required by migration 010. Drop-in
    # replacement for postgres:16-alpine; the existing data volume
    # works unchanged (same Postgres 16 binary underneath).
    image: pgvector/pgvector:pg16
    container_name: ai-gateway-postgres-webchat
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: sran_ai
      POSTGRES_USER: chatedge
      POSTGRES_PASSWORD: chatedge_pass
    volumes:
      - pgdata-webchat:/var/lib/postgresql/data
      # Mount migrations into the postgres initdb hook directory so
      # they run automatically the first time the volume is created.
      # Re-creating the schema requires ``docker compose -f
      # docker-compose.webchat.yml down -v`` to wipe the volume.
      - ./services/chat-edge-api/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatedge -d sran_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-webchat:
    image: redis:7-alpine
    container_name: ai-gateway-redis-webchat
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO — S3-compatible object storage for local dev. Optional
  # service: nothing pulls it up unless the operator runs it
  # explicitly via ``docker compose ... up minio`` or starts the
  # whole stack with STORAGE_BACKEND=s3 set on chat-edge-api.
  #
  # The dev credentials below are intentionally weak (``minioadmin
  # / minioadmin123``) — production deployments must override them via
  # secrets / env files. The same credentials are baked into the
  # init container that creates the bucket.
  minio:
    image: minio/minio:latest
    container_name: ai-gateway-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console (login at http://localhost:9001)
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot init container that creates the bucket + sets a download
  # anonymous policy so presigned URLs aren't strictly required for
  # development. Exits after running so it's safe to leave in the
  # compose graph; subsequent ``up`` invocations just re-run it
  # quickly and the bucket-create command is a no-op once it exists.
  minio-init:
    image: minio/mc:latest
    container_name: ai-gateway-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mc alias set local http://minio:9000 minioadmin minioadmin123
        mc mb --ignore-existing local/${S3_BUCKET:-sran-chat-files}
        mc anonymous set download local/${S3_BUCKET:-sran-chat-files}
        echo "MinIO bucket ready: ${S3_BUCKET:-sran-chat-files}"

  # Web Chat front-end — Next.js standalone build. The browser talks
  # to chat-edge-api on the host (port 4000) so CORS + cookies work
  # the same dev vs prod; build-time env var bakes in the API base.
  #
  # NEXT_PUBLIC_* is INLINED BY THE BUNDLER AT BUILD TIME. Setting it only
  # under `environment:` had no effect on the browser bundle — the build ran
  # without it and baked in lib/api.ts's localhost fallback, so any
  # non-localhost deploy silently talked to the wrong host. It is now passed
  # as a build arg (authoritative) AND kept as runtime env (server-side
  # rendering + parity). Changing WEB_CHAT_API_URL requires a REBUILD of this
  # image, not just a restart.
  web-chat:
    build:
      context: ./apps/web-chat
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${WEB_CHAT_API_URL:-http://localhost:4000/api/v1}
        # SSO Phase 1 (D1): the auth endpoints web-chat's browser bundle
        # talks to. Same build-time inlining rule as NEXT_PUBLIC_API_URL
        # — without these, non-localhost images bake in the localhost
        # fallbacks from lib/auth.ts and session lookup / silent refresh
        # / login redirect all break. Changing them requires a REBUILD.
        NEXT_PUBLIC_GATEWAY_URL: ${WEB_CHAT_GATEWAY_URL:-http://localhost:8080}
        NEXT_PUBLIC_PORTAL_URL: ${WEB_CHAT_PORTAL_URL:-http://localhost:3001}
        # (FIX20 §6.5: the desktop shell's hosted mode is detected at RUNTIME
        # from window.sranHost — no NEXT_PUBLIC_HOSTED build arg; one image
        # serves the browser and the Electron app.)
    container_name: ai-gateway-web-chat
    ports:
      - "3002:3002"
    environment:
      - NEXT_PUBLIC_API_URL=${WEB_CHAT_API_URL:-http://localhost:4000/api/v1}
      - NEXT_PUBLIC_GATEWAY_URL=${WEB_CHAT_GATEWAY_URL:-http://localhost:8080}
      - NEXT_PUBLIC_PORTAL_URL=${WEB_CHAT_PORTAL_URL:-http://localhost:3001}
      - PORT=3002
    depends_on:
      - chat-edge-api

volumes:
  pgdata-webchat:
  minio-data:
  chat_edge_uploads:
