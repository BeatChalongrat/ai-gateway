name: CI

# Test gate only — no build / deploy. Runs on every push to main and on
# every PR targeting main so a broken change is caught before it lands.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same ref cancels the in-flight run — saves minutes
# on rapid iteration.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: backend (pytest, unit lane)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        # requirements-dev.txt pulls requirements.txt + the test extras
        # (respx, aiosqlite). The NER (presidio/spaCy) and semantic
        # extras are intentionally NOT installed — those tests live in
        # the integration lane and are excluded below, so CI stays fast.
        run: pip install -r requirements-dev.txt
      - name: Run unit lane
        # The integration lane (DLP engine/sidecar, NER, real Postgres,
        # gRPC limiter, live/e2e, container .env) is excluded — see the
        # `integration` marker + conftest auto-tag. This gate must be green.
        env:
          APP_ENV: test
        run: pytest -m "not integration" --tb=short
      - name: DLP egress-invariant gate (Phase 9 drift guard)
        # Already part of the unit lane above; this named step re-runs it
        # so the gate fails LOUDLY and independently if the module is ever
        # added to the integration exclusion list or deselected by a
        # marker change. Must never be skipped.
        env:
          APP_ENV: test
        run: pytest tests/test_dlp_egress_invariant.py --tb=short

  frontend-typecheck:
    # Job name kept stable (possible required-check reference); the lane
    # now ALSO runs the vitest unit suite (SSE parser, chatStore
    # streaming/optimistic-rollback, 401→refresh single-flight).
    name: web-chat (tsc --noEmit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web-chat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web-chat/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Unit tests (vitest)
        run: npm test
      - name: i18n ratchet (no new hard-coded UI strings — FIX87)
        run: npm run lint:i18n
      # FIX44 Part B — parity with .gitlab-ci.yml: every colour class in src
      # must be generated by Tailwind (opacity modifiers on bare var() colours
      # are dropped silently — OPEN_DECISIONS #42).
      - name: Generated-classes check
        run: npm run check:classes

  web-unit-test:
    # Vitest unit lanes for the other two Next.js apps. portal pins the
    # 401→refresh→retry single-flight; admin-ui pins the double-submit
    # CSRF header attach + 401 session clear.
    name: ${{ matrix.app }} (vitest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [portal, admin-ui]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm test

  web-e2e:
    # ────────────────────────────────────────────────────────────────
    # ⚠ NON-REQUIRED LANE — continue-on-error: true. This job may be
    # flaky (browser download, dev-server boot timing) and MUST NOT
    # gate merges. Do not add it to required status checks; do not
    # remove continue-on-error without team sign-off. The fast vitest
    # lanes above are the merge gate for web code.
    # ────────────────────────────────────────────────────────────────
    # Playwright happy path for web-chat: login handoff → send message
    # → streamed tokens render. All backends are mocked via route
    # interception (see tests/e2e), so it needs NO gateway/chat-edge/DB;
    # the Playwright webServer boots `next dev` on :3102 from source.
    name: web-chat e2e (Playwright, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: apps/web-chat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web-chat/package-lock.json
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web-chat/test-results/
          retention-days: 7

  go-test:
    name: chat-edge-api (go vet + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/chat-edge-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: services/chat-edge-api/go.sum
      - run: go vet ./...
      - run: go test ./...

  gateway-test:
    name: gateway (go vet + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: services/gateway/go.sum
      - run: go vet ./...
      - run: go test ./...

  mcp-gateway-test:
    name: mcp-gateway (node --test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/mcp-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches the service's Dockerfile (node:20-alpine).
          node-version: "20"
          cache: npm
          cache-dependency-path: services/mcp-gateway/package-lock.json
      - run: npm ci
      # Tests fake the child-process/JWT/upstream seams — no secrets, no
      # network beyond a loopback express upstream.
      - run: npm test

  desktop-test:
    name: SranDesktop (dotnet build + test, Windows)
    # net8.0-windows / WPF cannot build on Linux — this job MUST stay on
    # a Windows runner.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('SranDesktop/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Build (Release, warnings-as-informative but 0-error bar)
        run: dotnet build SranDesktop/SranDesktop.sln -c Release
      - name: Test
        # Suite is self-contained: sqlite in temp dirs, loopback
        # HttpListener fakes for MCP dials — no secrets, no live services.
        run: dotnet test SranDesktop/SranDesktop.sln -c Release --no-build

  repo-tracks:
    # AM19 — only what the code needs is tracked: a tracked file that
    # .gitignore excludes (working notes, probes, result folders, reports)
    # fails by name. Mirrors the gate's `tracks` lane and .gitlab-ci.yml.
    name: Only what the code needs is tracked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/gate/tracks.py

  secret-leak-guard:
    name: No NEXT_PUBLIC secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject NEXT_PUBLIC_ secrets in tracked files
        run: |
          # NEXT_PUBLIC_ vars are compiled into client JS by Next.js, so a
          # NEXT_PUBLIC_*API_KEY / *SECRET would ship a credential to the
          # browser (the P0-2 leak). Markdown docs and this workflow file
          # (which necessarily contains the pattern) are excluded.
          if git grep -lP 'NEXT_PUBLIC_\w*(SECRET|API_KEY)' -- ':!.github/workflows/ci.yml' ':!*.md'; then
            echo "::error::Found NEXT_PUBLIC_ secret references in tracked files — these get bundled into client-side JS."
            exit 1
          fi
          echo "OK: no NEXT_PUBLIC_ secret leaks in tracked files."

  security-audit:
    name: dependency audit (pip / npm / go / cargo)
    runs-on: ubuntu-latest
    # Gate on known-vulnerable dependencies across every ecosystem. This
    # is the lane that would have caught CVE-2025-29927 (Next.js) before
    # it landed. SAST (bandit/semgrep) is intentionally out of scope for
    # this first pass — dependency audit only.
    steps:
      - uses: actions/checkout@v4

      # --- Python (backend) ---
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: pip-audit (backend/requirements.txt)
        # Add `--ignore-vuln <ID>` here for any advisory triaged as an
        # accepted risk so the gate stays meaningful rather than muted.
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt

      # --- Node (admin-ui / portal / web-chat) ---
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: npm audit (three apps + mcp-gateway)
        # --audit-level=critical only fails the build on CRITICAL advisories
        # for now; lower the threshold to high/moderate once the backlog is
        # clean. Audits from each app's committed package-lock.json.
        run: |
          for app in admin-ui portal apps/web-chat services/mcp-gateway; do
            echo "=== npm audit: $app ==="
            ( cd "$app" && npm audit --audit-level=critical )
          done

      # --- Go (log-worker / chat-edge-api / gateway) ---
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: govulncheck (all Go modules)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          for dir in log-worker services/chat-edge-api services/gateway; do
            echo "=== govulncheck: $dir ==="
            ( cd "$dir" && govulncheck ./... )
          done

      # --- Rust (dlp-sidecar / rate-limiter) ---
      - name: cargo audit (all Rust crates)
        run: |
          cargo install cargo-audit --locked
          for dir in dlp-sidecar rate-limiter; do
            echo "=== cargo audit: $dir ==="
            ( cd "$dir" && cargo audit )
          done
