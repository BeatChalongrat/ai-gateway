# SRAN Desktop production reverse proxy (R11 B3)
# One domain + TLS in front of the whole stack; path routing lets the desktop
# app use a single base URL:
#   /api/v1/*   → chat-edge-api:4000   (conversations, KB, memory, share)
#   /v1/*       → gateway:8080         (auth, completions, search, agent keys)
#   /__gw/*     → gateway:8080         (health, metrics)
#   /portal/*   → portal:3001
#   /mcp/*      → mcp-gateway          (catalog + MCP servers)
#   /admin/*    → admin-ui:3000
#   /desktop/*  → static releases      (installer + update manifest)
#   /           → portal (landing)
#
# Routes live in sran-routes.inc (NOT .conf — nginx auto-includes conf.d/*.conf
# at http level, and bare location blocks there would fail the config test).

upstream chat_edge {
    server chat-edge-api:4000;
    keepalive 32;
}

upstream gateway_up {
    server gateway:8080;
    keepalive 32;
}

upstream portal_up {
    server portal:3001;
}

upstream admin_up {
    server admin-ui:3000;
}

upstream mcp_catalog {
    server mcp-gateway:3200;
}

# Don't leak the nginx version (Phase 17E).
server_tokens off;

# HTTP :80 — force TLS. This proxy always terminates TLS on :443 (certs are
# mounted), so plain HTTP is redirected rather than served (Phase 17E).
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;

    # Security headers (Phase 17E). The routes include declares no add_header,
    # so these inherit into every proxied location. A stricter script/style CSP
    # belongs on each SPA's own responses where its exact needs are known.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    include /etc/nginx/conf.d/sran-routes.inc;
}
