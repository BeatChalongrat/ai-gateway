# SRAN Desktop production reverse proxy (R11 B3)
# One domain + TLS in front of the whole stack; path routing lets the desktop
# app use a single base URL:
#   /api/v1/*   → chat-edge-api:4000   (conversations, KB, memory, share)
#   /v1/*       → gateway:8080         (auth, completions, search, agent keys)
#   /__gw/*     → gateway:8080         (health, metrics)
#   /portal/*   → portal:3001
#   /mcp/*      → mcp-gateway          (catalog + MCP servers)
#   /admin/*    → admin-ui:3000
#   /desktop/*  → static releases      (installer + update manifest)
#   /           → portal (landing)
#
# Routes live in sran-routes.inc (NOT .conf — nginx auto-includes conf.d/*.conf
# at http level, and bare location blocks there would fail the config test).

upstream chat_edge {
    server chat-edge-api:4000;
    keepalive 32;
}

upstream gateway_up {
    server gateway:8080;
    keepalive 32;
}

upstream portal_up {
    server portal:3001;
}

upstream admin_up {
    server admin-ui:3000;
}

upstream mcp_catalog {
    server mcp-gateway:3200;
}

server {
    listen 80;
    server_name _;

    # Production: force TLS by replacing the include below with
    #   return 301 https://$host$request_uri;
    include /etc/nginx/conf.d/sran-routes.inc;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    include /etc/nginx/conf.d/sran-routes.inc;
}
