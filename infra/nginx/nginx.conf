# Nginx — TLS-terminating front door for the Go gateway.
# INERT by default (this variant is not mounted by any compose file; the active
# production proxy is sran-desktop.conf). The gateway already catch-all-proxies
# everything to Python (which serves /v1, /portal, /admin, /auth, health), so
# nginx needs only the one upstream.
#
# Hardening (Phase 17E): server tokens off, security headers on every response,
# and an HTTPS front door + HTTP→HTTPS redirect staged below. HSTS and the
# redirect only take EFFECT once TLS is terminated here (certs mounted, 443
# block enabled). The other headers are harmless over plain HTTP.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 25m;   # match the gateway's /v1 body guard

    # Do not leak the nginx version in Server: headers or error pages.
    server_tokens off;

    log_format main '$remote_addr [$time_local] "$request" $status '
                    '$body_bytes_sent rt=$request_time uct=$upstream_connect_time';
    access_log /var/log/nginx/access.log main;

    upstream gateway {
        server gateway:8080;
        keepalive 32;
    }

    # ── HTTP :80 ──────────────────────────────────────────────────────────
    # No TLS in front → serve directly with security headers. When the :443
    # block is enabled, replace the two proxy locations with a redirect:
    #     location / { return 301 https://$host$request_uri; }
    server {
        listen 80;
        server_name _;

        # Baseline security headers (routes below declare no add_header, so
        # these inherit into every location).
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # Restrict the Prometheus scrape path in production.
        location = /__gw/metrics {
            proxy_pass http://gateway;
            # allow 10.0.0.0/8; deny all;
        }

        # Catch-all -> Go gateway. SSE-safe: buffering OFF so token deltas
        # stream in real time; long read timeout for streaming responses.
        location / {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_buffering off;     # critical for SSE
            proxy_cache off;
            proxy_read_timeout 120s;
        }
    }

    # ── HTTPS :443 (hardened front door) ──────────────────────────────────
    # Enable when certs are mounted at /etc/nginx/certs. HSTS is enforced here.
    #
    # server {
    #     listen 443 ssl;
    #     http2 on;
    #     server_name _;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;
    #     ssl_session_cache shared:SSL:10m;
    #
    #     add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    #     add_header X-Frame-Options "DENY" always;
    #     add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
    #     add_header X-Content-Type-Options "nosniff" always;
    #     add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    #     add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    #
    #     location = /__gw/metrics { proxy_pass http://gateway; }
    #     location / {
    #         proxy_pass http://gateway;
    #         proxy_http_version 1.1;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #         proxy_set_header Connection "";
    #         proxy_buffering off;
    #         proxy_cache off;
    #         proxy_read_timeout 120s;
    #     }
    # }
}
