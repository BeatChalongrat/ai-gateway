# Nginx — TLS-terminating front door for the Go gateway.
# INERT by default: only started via `docker compose --profile scaling up -d`.
# The gateway already catch-all-proxies everything to Python (which serves
# /v1, /portal, /admin, /auth, health), so nginx needs only the one upstream.
# Activation (admin-ui base-URL rebuild, removing the gateway's host port) is
# in SCALING_ACTIVATION_RUNBOOK.md.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 25m;   # match the gateway's /v1 body guard

    log_format main '$remote_addr [$time_local] "$request" $status '
                    '$body_bytes_sent rt=$request_time uct=$upstream_connect_time';
    access_log /var/log/nginx/access.log main;

    upstream gateway {
        server gateway:8080;
        keepalive 32;
    }

    server {
        listen 80;

        # --- TLS (uncomment when certs are mounted at /etc/nginx/certs) ---
        # listen 443 ssl http2;
        # ssl_certificate     /etc/nginx/certs/fullchain.pem;
        # ssl_certificate_key /etc/nginx/certs/privkey.pem;
        # ssl_protocols TLSv1.2 TLSv1.3;
        # ssl_ciphers HIGH:!aNULL:!MD5;

        # Restrict the Prometheus scrape path in production.
        location = /__gw/metrics {
            proxy_pass http://gateway;
            # allow 10.0.0.0/8; deny all;
        }

        # Catch-all -> Go gateway. SSE-safe: buffering OFF so token deltas
        # stream in real time; long read timeout for streaming responses.
        location / {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_buffering off;     # critical for SSE
            proxy_cache off;
            proxy_read_timeout 120s;
        }
    }
}
