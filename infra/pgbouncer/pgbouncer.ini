; PgBouncer — connection multiplexing in front of Postgres.
; INERT by default: only started via `docker compose --profile scaling up -d`.
; Activation (repoint the backend, disable prepared statements, bypass for
; migrations) is in SCALING_ACTIVATION_RUNBOOK.md.

[databases]
; Wildcard: route any requested dbname to the real Postgres. The client's
; dbname (e.g. ai_gateway) is passed through.
* = host=postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

; PG16 defaults to scram-sha-256 (NOT md5). PgBouncer derives the SCRAM
; proof from the plaintext password in userlist.txt (generated by
; entrypoint.sh from POSTGRES_USER/POSTGRES_PASSWORD).
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; Transaction pooling = max multiplexing. NOTE: this is why the backend
; must disable server-side prepared statements (psycopg3 prepare_threshold
; = None) and why the worker + migrations must bypass PgBouncer.
pool_mode = transaction

max_client_conn = 400
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3

server_idle_timeout = 300
server_lifetime = 3600
server_connect_timeout = 5

; SQLAlchemy/psycopg send these startup params; transaction pooling can't
; track them per-session, so ignore them to avoid connection errors.
ignore_startup_parameters = extra_float_digits,options

log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
stats_period = 60
