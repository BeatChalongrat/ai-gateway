[package]
name = "dlp-sidecar"
version = "0.1.0"
edition = "2021"

# Library crate exposes the detectors module so the integration
# parity tests in tests/parity/ can call into them. Both binaries
# (the server + healthcheck) link against the same lib.
[lib]
name = "dlp_sidecar"
path = "src/lib.rs"

[[bin]]
name = "dlp-sidecar"
path = "src/main.rs"

[[bin]]
name = "healthcheck"
path = "cmd/healthcheck/main.rs"

[dependencies]
tonic = "0.11"
prost = "0.12"
tokio = { version = "1", features = ["full"] }

# We use ``fancy-regex`` everywhere for consistency — even simple
# patterns without lookarounds work, and it's the only crate that
# can handle the IPv4/IPv6 lookbehinds + the OpenAI key's negative
# lookahead. Performance hit is acceptable for a parity-first port.
fancy-regex = "0.13"
once_cell = "1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
prometheus = "0.13"
hyper = { version = "0.14", features = ["server", "http1", "tcp"] }
unicode-normalization = "0.1"

[build-dependencies]
tonic-build = "0.11"

[profile.release]
strip = "symbols"
lto = "thin"
