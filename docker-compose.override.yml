# Dev-mode overrides. Compose auto-merges this on top of
# docker-compose.yml, so `docker compose up -d` in development gives
# you: hot-reload backend (uvicorn --reload), hot-reload admin-ui
# (next dev), hot-reload portal (next dev). In CI / prod, invoke
# compose with -f docker-compose.yml alone to skip this overlay.
services:
  backend:
    # Override the image CMD so uvicorn runs with --reload against the
    # mounted source tree. Migrations still run once on container start.
    # FIX126 O3 — `exec` makes uvicorn PID 1, so SIGTERM reaches it and a
    # restart does not wait out Docker's 10 s stop timeout.
    command: >-
      sh -c "python -m alembic upgrade head &&
             exec uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload --reload-dir /app/app"
    volumes:
      - ./backend:/app
      # Read-only mount so test_*_docs.py tests that read ../docs/*.md
      # from backend/ can resolve the path inside the container.
      - ./docs:/docs:ro
      # Same reason for examples/: test_dlp_docs.py validates the example
      # policy profiles in examples/*.json against the PolicyProfile
      # dataclass. Without this mount all 24 of its assertions fail on a
      # missing path, which is why the file sat in pyproject's --ignore
      # list rather than being fixed.
      - ./examples:/examples:ro
      # FIX127 E2 — the cross-tree gates (tool-policy parity with the desktop
      # and chat-edge tool registries, the egress invariant that reads Go
      # source, the service-JWT compose wiring) are quarantined ONLY while
      # the sibling tree is absent (tests/QUARANTINE.md O8-2/3/4). Mounted
      # read-only here, they are hard gates in the dev lane too, not just in
      # CI. Source only: bin/obj under SranDesktop are ignored by the tests.
      - ./services/chat-edge-api:/services/chat-edge-api:ro
      - ./SranDesktop/src:/SranDesktop/src:ro
      - ./docker-compose.yml:/docker-compose.yml:ro
      - ./docker-compose.prod.yml:/docker-compose.prod.yml:ro
    environment:
      # Schema-drift guard (FIX 3): dev hot-reloads source, so code can
      # advance past a long-lived container's schema — the container's own
      # `alembic upgrade head` (in `command:` above) runs once at container
      # START, and a hot reload does not re-run it.
      #
      # FIX90: that gap used to be closed by `autoupgrade`, which applied the
      # pending migrations IN-PROCESS. It meant any import of the app — a
      # pytest run inside the container, a one-off `python -c` — silently
      # migrated the developer's database; FIX88's migration 088 reached the
      # live database that way, not by anyone running it. A guard that
      # changes the thing it is guarding is not a guard.
      #
      # The default is now the same as prod's: refuse to start and name the
      # command. Measured on a scratch stack (own project, own volume, no
      # published ports): on an EMPTY volume the container command migrates
      # before uvicorn, so a fresh clone boots normally (healthy in 25 s);
      # with the DB deliberately one revision behind, the app refuses with
      # "SCHEMA DRIFT: DB at 087, code needs 088 - refusing to start", the
      # CONTAINER stays up (uvicorn's reloader outlives the failed app), so
      # `make migrate` reaches it, and the next reload comes back 200.
      # Set SCHEMA_DRIFT_MODE=autoupgrade in your own .env to opt back in.
      SCHEMA_DRIFT_MODE: ${SCHEMA_DRIFT_MODE:-failclosed}
      # watchfiles polls on the Windows-to-container bridge — docker
      # inotify events don't always propagate through the Hyper-V layer.
      WATCHFILES_FORCE_POLLING: "true"
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001,http://localhost:3002,http://127.0.0.1:3002

  admin-ui:
    # Run next dev out of a plain node image against the bind-mounted
    # source tree. The Dockerfile's prod multi-stage build is bypassed
    # for dev so edits on the host reload inside the container.
    image: node:20-alpine
    working_dir: /app
    command: sh -c "if [ ! -d node_modules ] || [ ! -f node_modules/.install-stamp ]; then npm ci && touch node_modules/.install-stamp; fi && npx next dev -H 0.0.0.0 -p 3000"
    volumes:
      - ./admin-ui:/app
      - admin_ui_node_modules:/app/node_modules
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
      # In-network gateway hostname for the chat-edge proxy's server-side
      # session check (see docker-compose.yml for the full rationale).
      GATEWAY_API_URL: http://backend:8080
      CHAT_EDGE_API_URL: http://chat-edge-api:4000/api/v1
      CHAT_EDGE_ADMIN_API_KEY: ${CHAT_EDGE_ADMIN_API_KEY:-dev-chat-edge-admin-key-change-in-prod}
      WATCHPACK_POLLING: "true"
    # No build block in dev: we only use the node:20-alpine base.
    build: !reset null

  portal:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "if [ ! -d node_modules ] || [ ! -f node_modules/.install-stamp ]; then npm ci && touch node_modules/.install-stamp; fi && npx next dev -H 0.0.0.0 -p 3001"
    volumes:
      - ./portal:/app
      - portal_node_modules:/app/node_modules
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8080
      NEXT_PUBLIC_OAUTH_ENABLED: ${NEXT_PUBLIC_OAUTH_ENABLED:-false}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3001}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-portal-nextauth-secret}
      BACKEND_URL: http://backend:8080
      WATCHPACK_POLLING: "true"
    build: !reset null

volumes:
  admin_ui_node_modules:
  portal_node_modules:
