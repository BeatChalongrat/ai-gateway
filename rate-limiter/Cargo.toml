[package]
name = "rate-limiter"
version = "0.1.0"
edition = "2021"

# Two binaries from the same workspace:
#  * ``rate-limiter`` — the gRPC server + sliding-window engine
#  * ``healthcheck``  — distroless-friendly HTTP probe used by Docker
#                       HEALTHCHECK / docker-compose
[[bin]]
name = "rate-limiter"
path = "src/main.rs"

[[bin]]
name = "healthcheck"
path = "cmd/healthcheck/main.rs"

[dependencies]
tonic = "0.11"
prost = "0.12"
tokio = { version = "1", features = ["full"] }
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }
deadpool-redis = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
prometheus = "0.13"
hyper = { version = "0.14", features = ["server", "http1", "tcp"] }
once_cell = "1"
async-trait = "0.1"
thiserror = "1"

[build-dependencies]
tonic-build = "0.11"

[profile.release]
# Strip debug symbols + LTO for a smaller distroless image. Build is
# slower but the runtime layer ends up ~5MB smaller.
strip = "symbols"
lto = "thin"
