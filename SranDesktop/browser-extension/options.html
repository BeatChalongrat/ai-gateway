<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>SRAN Desktop Browser Bridge</title>
  <style>
    body { font-family: "Segoe UI", sans-serif; max-width: 460px; margin: 40px auto; color: #222; }
    h1 { font-size: 18px; }
    label { display: block; font-size: 13px; margin: 16px 0 4px; color: #555; }
    input { width: 100%; padding: 8px; font-size: 13px; box-sizing: border-box; }
    button { margin-top: 12px; padding: 8px 18px; font-size: 13px; cursor: pointer; }
    #status { margin-top: 16px; font-size: 13px; }
    .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
    .on { background: #2ecc71; } .off { background: #e74c3c; }
    p.hint { font-size: 12px; color: #777; }
  </style>
</head>
<body>
  <h1>SRAN Desktop Browser Bridge</h1>
  <p class="hint">Paste the pairing token from SRAN Desktop → Settings → Browser, then save.
    The desktop app must be running.</p>
  <label for="token">Pairing token</label>
  <input id="token" type="text" autocomplete="off" spellcheck="false">
  <button id="save">Save &amp; reconnect</button>
  <div id="status"><span class="dot off"></span><span id="statusText">Not connected</span></div>
  <script src="options.js"></script>
</body>
</html>
