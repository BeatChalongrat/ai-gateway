<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<title>SRAN Desktop</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#0f1115; color:#e6e8ee; font-family:'Segoe UI',system-ui,sans-serif; }
  .card { background:#171a21; border:1px solid #262b36; border-radius:16px; padding:40px 48px;
          max-width:440px; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.5); }
  h1 { font-size:19px; margin:0 0 8px; font-weight:600; }
  p  { font-size:14px; color:#9aa3b2; margin:0 0 24px; line-height:1.6; }
  a.btn { display:inline-block; background:#3b6ef5; color:#fff; text-decoration:none;
          padding:11px 22px; border-radius:9px; font-size:14px; font-weight:600; }
  a.btn.secondary { background:transparent; border:1px solid #3a4150; color:#c7cdd8; margin-left:8px; }
  .hidden { display:none; }
  .err { color:#f87171; }
  .spin { width:22px; height:22px; border:3px solid #2a3140; border-top-color:#3b6ef5; border-radius:50%;
          margin:0 auto 16px; animation:r 1s linear infinite; }
  @keyframes r { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<div class="card">
  <!-- Shell-owned view (E2 §1). Three states, chosen by ?state=. The buttons are
       plain links to intent URLs on the app's own dev scheme; the shell refuses
       the navigation and acts on the intent. No bridge, no IPC. -->
  <div id="signed-out">
    <h1>SRAN Desktop</h1>
    <p>You are signed out.<br><span id="reason" class="err"></span></p>
    <a class="btn" id="signin" href="#">Sign in</a>
  </div>
  <div id="signing-in" class="hidden">
    <div class="spin"></div>
    <h1>Signing in…</h1>
    <p>Finish signing in with your browser. This window will update on its own.</p>
    <a class="btn secondary" id="cancel" href="#">Cancel</a>
  </div>
</div>
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    var state = q.get("state") || "signed-out";
    var scheme = q.get("scheme") || "sran-dev";
    var reason = q.get("reason") || "";
    document.getElementById("signin").href = scheme + "://signin";
    document.getElementById("cancel").href = scheme + "://cancel";
    document.getElementById("reason").textContent = reason;
    document.getElementById("signed-out").className = state === "signing-in" ? "hidden" : "";
    document.getElementById("signing-in").className = state === "signing-in" ? "" : "hidden";
  })();
</script>
</body>
</html>
