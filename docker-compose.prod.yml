# Production override for docker-compose.yml.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# or:
#   make prod
#
# What changes vs. `make up` (dev):
#
#   1. Internal-only services (mock-provider, ner-service, dlp-sidecar,
#      rate-limiter, log-worker) drop ALL host port mappings — they're
#      reachable only over the compose network. Closes the same class
#      of incident that exposed 5432 in prod.
#
#   2. postgres + redis bind 127.0.0.1 instead of 0.0.0.0. SSH-tunnelled
#      debug from an operator's laptop still works; the public NIC does
#      not reach them.
#
#   3. backend / admin-ui / portal bind 127.0.0.1 too. The assumption is
#      a reverse proxy (nginx / caddy) on the host fronts them with TLS
#      (gateway-api.sran.net). If a service should be public WITHOUT a
#      reverse proxy, switch its bind back to 0.0.0.0 here — never in
#      the base file.
#
#   4. Redis runs --requirepass ${REDIS_PASSWORD}. The backend reads
#      REDIS_PASSWORD (config.py) and folds it into redis_url. Both ends
#      must agree, which is why REDIS_PASSWORD uses ${VAR:?...} below —
#      compose refuses to start if it's unset.
#
#   5. APP_ENV=production. seed_audit_data.py refuses to seed the
#      hardcoded admin1234 in this mode; validate_secrets() rejects any
#      remaining "change-me-*" sentinels.
#
#   6. restart: always on every long-running service (escalated from
#      unless-stopped).
#
# Requires Docker Compose v2.24+ for the `!override` / `!reset` tags
# used to REPLACE (not append) the base file's `ports:` lists.

services:
  postgres:
    ports: !override
      - "127.0.0.1:5432:5432"
    restart: always

  redis:
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env for prod}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    # Base healthcheck uses unauthenticated `redis-cli ping`, which
    # returns NOAUTH once --requirepass is on. Pass the password and
    # silence the deprecation warning so the check actually exits 0.
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports: !override
      - "127.0.0.1:6379:6379"
    restart: always

  mock-provider:
    # Drop the host mapping entirely — the backend talks to the mock via
    # the compose DNS name. In a real prod deploy you would remove the
    # mock service from the stack; this stays for staging.
    ports: !reset []
    restart: always

  ner-service:
    ports: !reset []
    restart: always

  dlp-sidecar:
    # gRPC (50051) + metrics (9102). Scrape metrics with an in-network
    # prometheus, not from the host.
    ports: !reset []
    restart: always

  rate-limiter:
    ports: !reset []
    restart: always

  log-worker:
    ports: !reset []
    restart: always

  backend:
    environment:
      APP_ENV: production
      # CORS allowed origins — must match the public-facing reverse
      # proxy hostnames. Required: compose refuses to start otherwise.
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set in .env for prod (e.g. https://gateway-api.sran.net,https://admin.sran.net)}
      PORTAL_PUBLIC_URL: ${PORTAL_PUBLIC_URL:?PORTAL_PUBLIC_URL must be set in .env for prod}
      # Auth-cookie scope. Deliberately NOT hard-required here: a
      # single-host deployment (everything behind one nginx origin) is
      # correct with host-only cookies. But when portal / chat / gateway
      # sit on different SUBDOMAINS, an unset domain means the login
      # cookie never reaches chat-edge and every authed fetch 401s with
      # no loud error. Set it in .env — inherited from the base compose:
      #   AUTH_COOKIE_DOMAIN=.yourdomain.com
      #   AUTH_COOKIE_SAMESITE=lax        # "none" additionally requires
      #                                   # the domain + Secure, and drops
      #                                   # the portal's CSRF defence
      # Secure needs no setting: it auto-enables outside dev/test.
      # See docs/SSO-GO-LIVE.md §C.
      # FIX 1b — the gateway verifies chat-edge's service JWT with this;
      # hard-required in prod (same var + form as the chat-edge service so
      # both hold the SAME value). Without it the service-JWT path is
      # dormant and validate_secrets() refuses to start (chat-edge is wired).
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:?SERVICE_JWT_SECRET must be set for prod (openssl rand -hex 32) and MUST match the chat-edge service}
    ports: !override
      - "127.0.0.1:8080:8080"
    restart: always

  admin-ui:
    ports: !override
      - "127.0.0.1:3000:3000"
    restart: always

  portal:
    # The portal→chat handoff ("Open SRAN Chat" + the three redirect
    # allowlists) is baked into the bundle at BUILD time. Unset, it silently
    # becomes http://localhost:3002 — a dead button and a redirect allowlist
    # that no longer matches the real chat origin. Hard-required here for the
    # same reason CORS_ORIGINS and PORTAL_PUBLIC_URL are.
    # NOTE: this is a BUILD arg — after changing it, rebuild the portal image
    # (`docker compose -f docker-compose.yml -f docker-compose.prod.yml build
    # portal`); restarting the container alone will NOT pick it up.
    build:
      args:
        NEXT_PUBLIC_WEB_CHAT_URL: ${WEB_CHAT_PUBLIC_URL:?WEB_CHAT_PUBLIC_URL must be set in .env for prod (e.g. https://chat.sran.net/chat) — it is baked into the portal bundle at build time}
    environment:
      NEXT_PUBLIC_WEB_CHAT_URL: ${WEB_CHAT_PUBLIC_URL}
    ports: !override
      - "127.0.0.1:3001:3001"
    restart: always

  # R11 B1: chat-edge behind nginx only; all traffic enters via :80/:443.
  chat-edge-api:
    environment:
      CHAT_EDGE_DEV: ""
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:?SERVICE_JWT_SECRET must be set for prod (openssl rand -hex 32)}
      USER_JWT_SECRET: ${USER_JWT_SECRET:?USER_JWT_SECRET must be set for prod}
      CSRF_SECRET: ${CSRF_SECRET:?CSRF_SECRET must be set for prod}
      PORTAL_JWT_SECRET: ${PORTAL_JWT_SECRET:?PORTAL_JWT_SECRET must be set for prod}
      CHAT_EDGE_ADMIN_API_KEY: ${CHAT_EDGE_ADMIN_API_KEY:?CHAT_EDGE_ADMIN_API_KEY must be set for prod}
      CORS_ALLOW_ORIGINS: ${CHAT_CORS_ORIGINS:?CHAT_CORS_ORIGINS must be set for prod}
    ports: !override
      - "127.0.0.1:4000:4000"
    restart: always

  # R11 B2: MCP servers reachable only through nginx path routing.
  # Phase 10 C1: everything flows through :3200's JWT-verified proxy; the
  # per-child ports (:3201/:3202 and the dynamic per-user range) stay
  # container-internal.
  mcp-gateway:
    environment:
      MCP_PUBLIC_BASE: ${MCP_PUBLIC_BASE:?MCP_PUBLIC_BASE must be set for prod (e.g. https://sran.yourcompany.com)}
      MCP_PUBLIC_MODE: path
    ports: !override
      - "127.0.0.1:3200:3200"
    restart: always

  nginx:
    restart: always
