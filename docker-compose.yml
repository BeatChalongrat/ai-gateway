services:
  postgres:
    # pgvector build of PG16 (R11 B1): chat-edge-api's KB embeddings need the
    # vector extension. Data-directory compatible with the previous postgres:16.
    image: pgvector/pgvector:pg16
    # Phase-1 tuning. Two motivations:
    #   1. max_connections=200 — backend (4 workers × pool 30) + admin-ui +
    #      portal + alembic + ad-hoc psql must coexist below the cap.
    #      Defaulting to 100 leaves no margin once we add a second
    #      backend pod.
    #   2. synchronous_commit=off — request_logs is non-financial; durability
    #      lag of a few hundred ms on a crash is acceptable in exchange for
    #      removing fsync from every INSERT. audit_log, portal_users, and
    #      provider_keys still carry application-level integrity (AES-GCM
    #      audit blob, bcrypt, encrypted provider secrets) so a crash window
    #      cannot forge admin actions or leak credentials.
    # shared_buffers / effective_cache_size / wal_writer_delay /
    # checkpoint_completion_target are sized for the 8 GB dev box; bump
    # on production hardware via a compose override.
    command: >
      postgres
      -c max_connections=250
      -c shared_buffers=256MB
      -c synchronous_commit=off
      -c wal_writer_delay=200ms
      -c checkpoint_completion_target=0.9
      -c effective_cache_size=512MB
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_gateway}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # Dev fallback is the legacy "postgres" so `make up` keeps working
      # on a clean checkout. Production MUST set POSTGRES_PASSWORD in
      # .env (and docker-compose.prod.yml's binding to 127.0.0.1 keeps
      # the port off the public interface either way).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    # No host port: Postgres is reached over the docker network by
    # service name. Removes the direct-to-DB attack surface the log-worker
    # superuser DSN would otherwise expose on the host. For local psql,
    # add a port mapping in a personal docker-compose.override.yml.
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # R11 B1: create the chat-edge database + apply its migrations on FIRST
      # volume init (fresh deploys). Existing volumes: run
      # scripts/apply_chat_edge_migrations_main.sh (or make chat-edge-migrate-main).
      - ./infra/postgres/init-chat-edge-db.sh:/docker-entrypoint-initdb.d/02-chat-edge.sh:ro
      - ./services/chat-edge-api/migrations:/chat-edge-migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7
    # Cap memory + LRU eviction so an unbounded key set can't OOM the box.
    # The image default is maxmemory=0 (unlimited) / noeviction, under which
    # an OOM makes writes fail; allkeys-lru evicts cold keys instead. Tune
    # the ceiling via REDIS_MAXMEMORY.
    # --requirepass enforces AUTH on every connection — base parity with
    # docker-compose.prod.yml. REDIS_PASSWORD is required (set it in .env;
    # see .env.example). Every consumer passes the same secret: backend
    # folds it into redis_url (config.py), rate-limiter via REDIS_URL,
    # redis-exporter via REDIS_PASSWORD. No host port is published — the
    # session store / DLP token vault / rate-limit state stay on the
    # internal docker network only.
    command: >
      redis-server
      --maxmemory ${REDIS_MAXMEMORY:-512mb}
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    healthcheck:
      # redis-cli ping returns NOAUTH once --requirepass is on, so auth.
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  mock-provider:
    build:
      context: ./mock
    image: ai-gateway-mock-provider:latest
    container_name: ai-gateway-mock-provider
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9090/health', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # Dedicated NER service — owns the heavy spaCy model so the gateway
  # workers stay light. The gateway calls this via NER_SERVICE_URL;
  # leaving the URL unset falls back to the legacy in-process loader.
  #
  # Multi-worker: each of the 4 uvicorn workers is its own process with
  # its own spaCy/Presidio analyzer (~12 MB for en_core_web_sm; lazy-
  # loaded via the lifespan hook). Concurrent requests across workers
  # are CPU-parallel; within one worker spaCy holds the GIL during
  # analyze() but the read-only AnalyzerEngine is safe to share across
  # coroutines.
  ner-service:
    build:
      context: ./backend
      dockerfile: ner_service/Dockerfile
    image: ai-gateway-ner-service:latest
    environment:
      NER_WORKERS: ${NER_WORKERS:-4}
      # Per-language confidence floors. Thai NER is noisier than
      # English on conversational prose, so its floor stays higher
      # by default. Both are overridable per-deployment if a
      # particular workload needs tuning.
      NER_SCORE_THRESHOLD_EN: ${NER_SCORE_THRESHOLD_EN:-0.7}
      NER_SCORE_THRESHOLD_TH: ${NER_SCORE_THRESHOLD_TH:-0.85}
    ports:
      - "8001:8001"
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: "4g"
        reservations:
          cpus: "2.0"
          memory: "2g"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8001/health | grep -q '\"status\":\"ready\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  # Phase-3c Rust DLP sidecar. gRPC server is OPERATIONAL: ScanText,
  # ScanMessages and Health are all implemented (src/main.rs). The
  # registry ports 29 regex/heuristic detectors (NER-on default;
  # NER-off swaps in thai_name_no_prefix → 30) — full parity with the
  # Python regex detector set. spaCy NER is intentionally NOT ported;
  # it stays in the dedicated ner-service. Shadow mode is wired
  # (DLP_ENGINE=shadow runs both and logs dlp_shadow_diff).
  # Gated by DLP_ENGINE (default: python). Fail-open: any gRPC
  # error/timeout falls back to the Python registry.
  # PARITY: remediated to 100% (211/211, 0 FN/0 FP) — all 4 blocking +
  # 7 minor detector gaps fixed in Rust, and the encoding-bypass
  # preprocessing (zero-width strip + offset remap, homoglyph, base64
  # decode-and-scan) runs in a Python wrapper in rust_dlp_client before
  # the gRPC call. Safe to flip DLP_ENGINE=rust (see DLP_BENCHMARK.md;
  # rollback = python). Re-verify with backend/tests/dlp_parity_runner.py.
  dlp-sidecar:
    build:
      context: ./dlp-sidecar
    image: ai-gateway-dlp-sidecar:latest
    environment:
      GRPC_PORT: "50051"
      METRICS_PORT: "9102"
    # gRPC 50051 is internal-only (backend reaches it via the docker
    # network). Metrics port stays published for local Prometheus.
    ports:
      - "9102:9102"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: "512m"
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Phase-3b Rust rate-limiter — gRPC sidecar that runs the same
  # sliding-window check as the legacy Python service against the
  # shared Redis. Gated by RATE_LIMITER_ENGINE=rust on the backend;
  # default (python) leaves this service idle.
  rate-limiter:
    build:
      context: ./rate-limiter
    image: ai-gateway-rate-limiter:latest
    environment:
      # REDIS_PASSWORD required (redis --requirepass). Folded into the
      # URL the deadpool-redis pool reads (main.rs).
      REDIS_URL: "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@redis:6379"
      GRPC_PORT: "50053"
      METRICS_PORT: "9101"
    # gRPC 50053 is internal-only (reached via the docker network by the
    # backend). Metrics port stays published for local Prometheus.
    ports:
      - "9101:9101"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "128m"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # Distroless cc has no shell — the Rust ``/healthcheck``
      # binary (built by the same Dockerfile) HTTP-GETs the metrics
      # port's /healthz and exits 0/1.
      test: ["CMD", "/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # Phase-3 Go log-worker — asynchronous sink for request_logs.
  #
  # Activated only when the gateway sets LOG_WORKER_ENGINE=go; the
  # default (python) path runs the legacy in-process queue and never
  # touches this service. Sidecar is a small distroless image
  # (~30MB) so leaving it running idle has negligible cost.
  log-worker:
    build:
      context: ./log-worker
    image: ai-gateway-log-worker:latest
    environment:
      POSTGRES_DSN: "host=postgres port=5432 dbname=${POSTGRES_DB:-ai_gateway} user=${POSTGRES_USER:-postgres} password=${POSTGRES_PASSWORD:-postgres} sslmode=disable"
      GRPC_PORT: "50052"
      METRICS_PORT: "9100"
      BATCH_SIZE: ${LOG_WORKER_BATCH_SIZE:-100}
      FLUSH_INTERVAL_MS: ${LOG_WORKER_FLUSH_INTERVAL_MS:-100}
      QUEUE_BUFFER: ${LOG_WORKER_QUEUE_BUFFER:-50000}
    # gRPC 50052 is internal-only (backend reaches it via the docker
    # network). Metrics port stays published for local Prometheus.
    ports:
      - "9100:9100"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Distroless static has no shell or wget, so we ship a tiny
      # Go ``/healthcheck`` binary alongside the worker (see the
      # log-worker Dockerfile). It HTTP-GETs :9100/healthz and
      # exits 0 / 1; Docker invokes the binary directly without
      # going through a shell.
      test: ["CMD", "/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Go API gateway (Phase 1 strangler-fig) — the public entry point on
  # :8080. Transparent reverse proxy in front of the Python backend:
  # coarse API-key auth on /v1/*, Prometheus metrics, request-ID
  # propagation. Forwards EVERY request (streaming included) to
  # backend:8080 unchanged — Python stays authoritative for routing,
  # DLP, full auth, dispatch, and logging. See services/gateway/README.md.
  gateway:
    build:
      context: ./services/gateway
    environment:
      PORT: "8080"
      # Python's container bind is unchanged (gunicorn -b 0.0.0.0:8080);
      # only its host publish moved to 8081. The gateway reaches it on
      # the compose network at the container port.
      PYTHON_SERVICE_URL: http://backend:8080
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ai_gateway}
      REDIS_URL: redis://redis:6379/0
      GATEWAY_AUTH_CACHE_TTL: ${GATEWAY_AUTH_CACHE_TTL:-30s}
      GATEWAY_MAX_BODY_BYTES: ${GATEWAY_MAX_BODY_BYTES:-26214400}
      APP_ENV: ${APP_ENV:-development}
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # GET (not --spider/HEAD): the gateway's chi router serves /__gw/health
      # on GET only, and wget --spider sends HEAD -> 404 -> false "unhealthy".
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/__gw/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Chat Edge API (R11 B1) — conversations, messages, memory, KB/RAG, files,
  # web search, share links. The desktop app and web chat both talk to this
  # service. Shares the main postgres (dedicated database, created by
  # infra/postgres/init-chat-edge-db.sh) and the main redis (db 2).
  # NOTE: the Go binary does NOT run migrations itself — it fail-closed
  # verifies them. Fresh volumes get them via the postgres init hook; after
  # pulling new migrations run scripts/apply_chat_edge_migrations_main.sh.
  chat-edge-api:
    build:
      context: ./services/chat-edge-api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${CHAT_EDGE_DB:-sran_chat}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@redis:6379/2
      GATEWAY_API_URL: http://gateway:8080/v1
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:-}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-}
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:-dev-service-jwt-secret-change-in-prod}
      USER_JWT_SECRET: ${USER_JWT_SECRET:-dev-user-jwt-secret-change-in-prod}
      CSRF_SECRET: ${CSRF_SECRET:-dev-csrf-secret-change-in-prod}
      PORTAL_JWT_SECRET: ${PORTAL_JWT_SECRET:-dev-stable-portal-key-change-in-prod}
      PORT: "4000"
      CHAT_EDGE_DEV: ${CHAT_EDGE_DEV:-1}
      CHAT_EDGE_ADMIN_API_KEY: ${CHAT_EDGE_ADMIN_API_KEY:-dev-chat-edge-admin-key-change-in-prod}
      CORS_ALLOW_ORIGINS: ${CHAT_CORS_ORIGINS:-http://localhost:3002}
      MAX_CONTEXT_MESSAGES: ${MAX_CONTEXT_MESSAGES:-1000}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      S3_BUCKET: ${S3_BUCKET:-sran-chat-files}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      IMAGE_GEN_MODEL: ${IMAGE_GEN_MODEL:-gpt-image-1}
      CHAT_EDGE_IMAGE_TIMEOUT_SECONDS: ${CHAT_EDGE_IMAGE_TIMEOUT_SECONDS:-180}
    volumes:
      - chat_edge_uploads:/app/data/uploads
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gateway:
        condition: service_healthy
    healthcheck:
      # chat-edge serves GET /health at the router root (NOT /api/v1/health).
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    profiles: ["desktop"]

  # MCP Gateway (R11 B2 + Phase 10 C1) — hosts stdio MCP servers behind
  # streamable-HTTP via supergateway; the desktop app reads /catalog.json to
  # discover them. ALL servers (built-in filesystem/memory included) are
  # reached through :3200's JWT-verified per-user proxy — the old shared,
  # unauthenticated children on :3201/:3202 are gone.
  mcp-gateway:
    build:
      context: ./services/mcp-gateway
    environment:
      # Dev: catalog advertises http://localhost:3200/mcp/servers/{id}.
      # Prod: set MCP_PUBLIC_BASE=https://sran.yourcompany.com and
      # MCP_PUBLIC_MODE=path → URLs become {base}/mcp/servers/{id} (nginx routes).
      MCP_PUBLIC_BASE: ${MCP_PUBLIC_BASE:-http://localhost}
      MCP_PUBLIC_MODE: ${MCP_PUBLIC_MODE:-port}
      # Phase 7: per-user oauth2 connector instances. The gateway verifies
      # the caller's portal JWT (same HS256 secret the backend signs with)
      # and fetches the user's provider token from the backend broker.
      PORTAL_JWT_SECRET: ${PORTAL_JWT_SECRET:-dev-stable-portal-key-change-in-prod}
      BACKEND_BASE: http://backend:8080
      # Slack workspace id for the slack connector (deployment-level).
      MCP_SLACK_TEAM_ID: ${MCP_SLACK_TEAM_ID:-}
    ports:
      - "3200:3200"
    volumes:
      - mcp_workspace:/data/workspace
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3200/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    profiles: ["desktop"]

  backend:
    build:
      context: ./backend
    environment:
      # Pin UTF-8 everywhere so Thai-language request bodies, mask
      # tokens, and the ฿ symbol travel through Python stdout / SQL
      # client / JSON encoders without ambient-locale surprises.
      # The base image already ships C.UTF-8, but setting these
      # explicitly documents the contract and survives a future
      # image rebase to a locale-less variant.
      PYTHONIOENCODING: utf-8
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      APP_ENV: ${APP_ENV:-development}
      # Schema-drift guard (FIX 3). Base stack defaults to failclosed: the
      # Dockerfile CMD migrates before gunicorn, so a stale schema at boot
      # means the migrate step was bypassed — refuse to start (named error)
      # rather than serve 500s. The dev override flips this to autoupgrade.
      SCHEMA_DRIFT_MODE: ${SCHEMA_DRIFT_MODE:-failclosed}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ai_gateway}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # Track A pool sizing — TWO pools (see backend/app/core/db.py):
      #  * ASYNC (chat hot path): connection RELEASED during the provider
      #    call, so a small pool serves high concurrency.
      #  * SYNC (admin/portal/background + 3 rare chat sync points): small.
      # Budget/worker: sync(5+5) + async(10+15) = 35; ×4 workers = 140,
      # well under Postgres max_connections=250 (leaves headroom for
      # migrations / psql / background sessions). db.py reads these at
      # import; missing → the same defaults shown here.
      DB_SYNC_POOL_SIZE: ${DB_SYNC_POOL_SIZE:-5}
      DB_SYNC_MAX_OVERFLOW: ${DB_SYNC_MAX_OVERFLOW:-5}
      DB_ASYNC_POOL_SIZE: ${DB_ASYNC_POOL_SIZE:-10}
      DB_ASYNC_MAX_OVERFLOW: ${DB_ASYNC_MAX_OVERFLOW:-15}
      POSTGRES_MAX_CONNECTIONS: "250"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Empty in dev (redis runs unauthenticated on the compose
      # network). docker-compose.prod.yml sets this AND adds
      # --requirepass on the redis service so both ends stay in sync.
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-dev-stable-key-change-in-prod}
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:-dev-stable-key-change-in-prod}
      PORTAL_JWT_SECRET: ${PORTAL_JWT_SECRET:-dev-stable-portal-key-change-in-prod}
      # Trust anchor for the chat-edge → gateway X-User-ID header
      # (per-end-user rate limiting AND per-end-user credit billing
      # behind the shared service key). MUST match the chat-edge
      # stack's INTERNAL_SERVICE_SECRET. Empty disables the trust
      # (headers are then ignored — safe default).
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-}
      # FIX 1b — the gateway VERIFIES chat-edge's service JWT with this
      # secret (deps.py::_resolve_service_jwt). It MUST equal the same var
      # under chat-edge-api (which SIGNS with it) or every service JWT is
      # rejected and chat silently falls back to INTERNAL_SERVICE_SECRET —
      # leaving FIX 1's gw_-key decoupling dormant. One var feeds both so
      # they always match. Empty = feature disabled (gateway-only deploys).
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:-dev-service-jwt-secret-change-in-prod}
      # Media generation (Sprint 2A/2A.5). Feature-flagged OFF by default;
      # set VIDEO_GEN_ENABLED=true in the host env to surface dedicated video
      # models in /v1/models + enable the video gen routes/tool. Controlled
      # here (not hardcoded) so `VIDEO_GEN_ENABLED=true docker compose up -d
      # backend` flips it without a code change.
      VIDEO_GEN_ENABLED: ${VIDEO_GEN_ENABLED:-false}
      # DLP HMAC secret — drives deterministic per-conversation
      # tokenization when a request supplies metadata.conversation_id.
      # Generate prod value with: python3 -c "import secrets;print(secrets.token_hex(32))"
      DLP_HMAC_KEY: ${DLP_HMAC_KEY:-dev-dlp-hmac-key-change-in-production}
      # NER microservice URL. When set, presidio_ner.py delegates to
      # this service instead of loading spaCy in-process.
      NER_SERVICE_URL: ${NER_SERVICE_URL:-http://ner-service:8001}
      NER_SERVICE_TIMEOUT_SECONDS: ${NER_SERVICE_TIMEOUT_SECONDS:-2.0}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      IMAGE_GENERATION_TIMEOUT_SECONDS: ${IMAGE_GENERATION_TIMEOUT_SECONDS:-180}
      OPENAI_IMAGE_TIMEOUT_SECONDS: ${OPENAI_IMAGE_TIMEOUT_SECONDS:-180}
      # 3000=admin-ui, 3001=portal, 3002=web-chat. allow_credentials=True
      # requires explicit origins (no "*"), and web-chat (:3002) now calls
      # the gateway directly for silent refresh, so it must be listed.
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:3002
      # Portal auth cookies (HttpOnly migration). Empty domain = host-only
      # (localhost shares across ports in dev). AUTH_COOKIE_SECURE unset =
      # auto (off in dev, on in prod). docker-compose.prod.yml sets the
      # parent domain + Secure=true.
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
      AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-lax}
      # The portal origin the user browses to. Verification links,
      # password-reset links, and invite-link emails are stamped with
      # this host — mismatched value = dead links in email.
      PORTAL_PUBLIC_URL: ${PORTAL_PUBLIC_URL:-http://localhost:3001}
      # Empty by default → adapters hit real provider URLs. Uncomment
      # PROVIDER_BASE_URL_OVERRIDES in .env to redirect openai/
      # anthropic/openrouter at the in-cluster mock-provider service.
      PROVIDER_BASE_URL_OVERRIDES: ${PROVIDER_BASE_URL_OVERRIDES:-}
      # Batch A provider-resilience knobs — all default to previous
      # behavior when unset (no caps, pool 50/20/30s, 4 workers). See
      # .env.example for the cap x GUNICORN_WORKERS sizing formula.
      PROVIDER_CONCURRENCY_CAPS: ${PROVIDER_CONCURRENCY_CAPS:-}
      PROVIDER_CONCURRENCY_ACQUIRE_TIMEOUT_SECONDS: ${PROVIDER_CONCURRENCY_ACQUIRE_TIMEOUT_SECONDS:-1.0}
      PROVIDER_POOL_MAX_CONNECTIONS: ${PROVIDER_POOL_MAX_CONNECTIONS:-50}
      PROVIDER_POOL_MAX_KEEPALIVE_CONNECTIONS: ${PROVIDER_POOL_MAX_KEEPALIVE_CONNECTIONS:-20}
      PROVIDER_POOL_KEEPALIVE_EXPIRY_SECONDS: ${PROVIDER_POOL_KEEPALIVE_EXPIRY_SECONDS:-30.0}
      PROVIDER_POOL_OVERRIDES: ${PROVIDER_POOL_OVERRIDES:-}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
      # Phase-3 log-worker engine selector. ``python`` keeps the
      # legacy in-process queue; ``go`` dispatches to the Go sidecar
      # over gRPC. Falls back to the legacy path automatically when
      # the sidecar is unreachable or grpcio is missing.
      LOG_WORKER_ENGINE: ${LOG_WORKER_ENGINE:-python}
      LOG_WORKER_GRPC_ADDRESS: ${LOG_WORKER_GRPC_ADDRESS:-log-worker:50052}
      LOG_WORKER_GRPC_TIMEOUT_SECONDS: ${LOG_WORKER_GRPC_TIMEOUT_SECONDS:-0.5}
      # Phase-3b Rust rate-limiter sidecar. ``python`` keeps the
      # legacy in-process sliding-window; ``rust`` dispatches to the
      # gRPC sidecar (fail-open fallback to Python on any error).
      RATE_LIMITER_ENGINE: ${RATE_LIMITER_ENGINE:-python}
      RATE_LIMITER_GRPC_ADDRESS: ${RATE_LIMITER_GRPC_ADDRESS:-rate-limiter:50053}
      RATE_LIMITER_GRPC_TIMEOUT_SECONDS: ${RATE_LIMITER_GRPC_TIMEOUT_SECONDS:-0.5}
      # Phase-3c Rust DLP sidecar engine selector. ``python`` keeps
      # the in-process registry; ``rust`` dispatches scans via gRPC
      # (fail-open fallback to Python); ``shadow`` runs both in
      # parallel and logs diffs.
      DLP_ENGINE: ${DLP_ENGINE:-python}
      DLP_GRPC_ADDRESS: ${DLP_GRPC_ADDRESS:-dlp-sidecar:50051}
      DLP_GRPC_TIMEOUT_SECONDS: ${DLP_GRPC_TIMEOUT_SECONDS:-1.0}
      # DLP system-prompt variant. ``v1`` (default) = verbose
      # "Critical rule: do not invent" copy with [CATEGORY_NUMBER]
      # example. ``v3`` = no-example variant audited to lower
      # hallucination rate. A/B by flipping per deployment.
      DLP_PROMPT_VARIANT: ${DLP_PROMPT_VARIANT:-v1}
      # Pseudonymization mode — readable <<CATEGORY_N>> token shape
      # on identity-class detectors. Default-on; set to ``false`` in
      # .env to revert to the legacy <rN> shape on every detector.
      DLP_PSEUDONYM_MODE: ${DLP_PSEUDONYM_MODE:-true}
    volumes:
      # Mount the DLP parity fixtures so the Python parity test can
      # read them from inside the backend container. Read-only and
      # tiny (<10kB) — purely a test-time convenience.
      - ./dlp-sidecar/tests/parity/fixtures:/work/dlp-sidecar/tests/parity/fixtures:ro
    ports:
      # Python is now an internal service behind the Go gateway. Its
      # container bind stays 8080; the host publish moved to 8081 so you
      # can still curl Python directly for debugging during the
      # migration. External clients should hit the gateway on :8080.
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-provider:
        condition: service_healthy
      ner-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  admin-ui:
    build:
      context: ./admin-ui
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
      # Server-side base URL the chat-edge proxy uses to validate the
      # admin session against gateway-api's /auth/session/me. MUST be the
      # in-network service hostname — NEXT_PUBLIC_API_BASE_URL is a
      # browser URL (localhost:8080) and is unreachable from inside the
      # container, which would make every admin session check 401.
      GATEWAY_API_URL: http://backend:8080
      CHAT_EDGE_API_URL: http://chat-edge-api:4000/api/v1
      CHAT_EDGE_ADMIN_API_KEY: ${CHAT_EDGE_ADMIN_API_KEY:-dev-chat-edge-admin-key-change-in-prod}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  portal:
    build:
      context: ./portal
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
        NEXT_PUBLIC_OAUTH_ENABLED: ${NEXT_PUBLIC_OAUTH_ENABLED:-false}
        # Where SRAN Chat lives — the "Open SRAN Chat" dashboard link plus
        # the three redirect allowlists (middleware.ts, LoginForm,
        # oauth-complete) all read this. It was never set anywhere, so the
        # bundler inlined the localhost:3002 fallback at build time and the
        # portal→chat handoff broke on any real hostname. NEXT_PUBLIC_* is a
        # BUILD-time substitution: changing WEB_CHAT_PUBLIC_URL requires
        # rebuilding the portal image (`make build`), not just a restart.
        # The three allowlist sites take .origin of this value, so the /chat
        # suffix the dashboard link wants is harmless to them.
        NEXT_PUBLIC_WEB_CHAT_URL: ${WEB_CHAT_PUBLIC_URL:-http://localhost:3002/chat}
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
      NEXT_PUBLIC_OAUTH_ENABLED: ${NEXT_PUBLIC_OAUTH_ENABLED:-false}
      # Runtime twin of the build arg above (server-render parity). The build
      # arg is the authoritative one for anything the browser executes.
      NEXT_PUBLIC_WEB_CHAT_URL: ${WEB_CHAT_PUBLIC_URL:-http://localhost:3002/chat}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3001}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-portal-nextauth-secret}
      BACKEND_URL: http://backend:8080
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    ports:
      - "3001:3001"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # --- Observability (Phase 3, Commit 4) ----------------------------------
  # Prometheus scrapes the Go gateway (/__gw/metrics), Python backend
  # (/metrics), and Redis (via redis-exporter). Host port 9091 — 9090 is
  # already taken by mock-provider.
  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    ports:
      - "9091:9090"
    depends_on:
      - gateway
      - backend
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      # 3100 on the host — 3000/3001 are admin-ui/portal.
      - "3100:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.61.0
    environment:
      REDIS_ADDR: redis://redis:6379
      # Redis now requires AUTH (--requirepass) — the exporter must send it.
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    expose:
      - "9121"
    depends_on:
      - redis
    restart: unless-stopped

  # --- Scaling infra (INERT — compose profile "scaling" only) -------------
  # None of these start under `docker compose up -d`; the current stack is
  # UNCHANGED. Bring them up additively with:
  #     docker compose --profile scaling up -d
  # Adding them here wires up NOTHING on its own. Full ACTIVATION (repoint
  # backend -> pgbouncer, disable prepared statements, bypass migrations,
  # remove the equivalent lifespan jobs, rebuild admin-ui base URL) is in
  # SCALING_ACTIVATION_RUNBOOK.md.
  pgbouncer:
    profiles: ["scaling"]
    image: edoburu/pgbouncer:1.22.0
    entrypoint: ["/bin/sh", "/pgbouncer-entrypoint.sh"]
    volumes:
      - ./infra/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./infra/pgbouncer/entrypoint.sh:/pgbouncer-entrypoint.sh:ro
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${PGBOUNCER_PORT:-6432}:6432"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Singleton background-job runner (advisory-locked). DIRECT to postgres —
  # NOT pgbouncer — because the jobs hold session-level advisory locks.
  worker:
    profiles: ["scaling"]
    build:
      context: ./backend
    command: ["python", "-m", "worker"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ai_gateway}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_ENV: ${APP_ENV:-development}
      PROVIDER_KEY_MASTER_KEY: ${PROVIDER_KEY_MASTER_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Unified reverse proxy (R11 B3): one domain + TLS in front of the whole
  # stack, path-routed for the desktop app's single-URL mode. Kept behind
  # profiles so dev `make up` doesn't grab :80; `make prod-desktop` enables it.
  nginx:
    profiles: ["scaling", "desktop"]
    image: nginx:1.27-alpine
    volumes:
      - ./infra/nginx/sran-desktop.conf:/etc/nginx/conf.d/default.conf:ro
      # .inc (not .conf): nginx auto-includes conf.d/*.conf, which would
      # double-load the location blocks outside a server{} and fail.
      - ./infra/nginx/sran-routes.inc:/etc/nginx/conf.d/sran-routes.inc:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
      - ./releases:/var/www/releases:ro # desktop installer + update manifest
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    depends_on:
      - gateway
      - chat-edge-api
      - portal
    restart: unless-stopped

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  chat_edge_uploads:
  mcp_workspace:
